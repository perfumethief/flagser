<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f2eff1">
<title>veilradio. / float mode study</title>
<style>
:root{--ink:#4a414c;--muted:#8b828c;--line:#d8d1d8;--soft:#eee9ed;--pink:#e3d3d8;--green:#cbd2b7;--paper:#f9f7f6;--shadow:rgba(77,62,76,.1);--mono:ui-monospace,"SFMono-Regular",Consolas,"Courier New",monospace;--serif: "Iowan Old Style","Baskerville","Palatino Linotype",Georgia,serif}
*,*::before,*::after{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:#f5f3f3;color:var(--ink);font-family:var(--mono);-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,.float-card:focus-visible{outline:2px solid #998595;outline-offset:4px}
#app{width:100%;height:100svh;min-height:390px;display:flex;flex-direction:column;position:relative;overflow:hidden;
 background: radial-gradient(ellipse 40% 55% at 6% 68%,rgba(229,217,224,.47),transparent 85%),radial-gradient(ellipse 38% 48% at 96% 14%,rgba(228,216,220,.40),transparent 75%),linear-gradient(135deg,#f8f7f6 0%,#f3f0f1 60%,#f7f5f4 100%)}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.24;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 170 170' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.63' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.09'/%3E%3C/svg%3E")}
.mast{height:95px;flex:none;z-index:20;position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px clamp(24px,3.2vw,54px) 14px;border-bottom:1px solid rgba(100,82,100,.14)}
.brandline{display:flex;align-items:baseline;gap:21px;min-width:0}
.logo{font-family:var(--serif);letter-spacing:-.085em;font-weight:400;font-size:clamp(34px,3vw,47px);line-height:1;white-space:nowrap}
.logo span{color:#a791a1}
.brandcode{white-space:nowrap;font-size:10px;letter-spacing:.17em;color:#8b8089}
.topright{display:flex;gap:24px;align-items:center;font-size:11px;letter-spacing:.12em;color:#877b88}
.total{color:#514552;font-size:13px;letter-spacing:.1em;min-width:76px;text-align:right}
.pin{display:inline-flex;align-items:center;justify-content:center;background:#e5d9e0;color:#655264;border-radius:50%;width:7px;height:7px;margin-right:9px;box-shadow:0 0 0 4px rgba(219,208,215,.35)}
.stage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;isolation:isolate}
.stage::before{content:"";position:absolute;inset:0;opacity:.34;z-index:0;pointer-events:none;background-image:radial-gradient(#d4cbd4 .6px,transparent .7px);background-size:23px 23px;mask-image:linear-gradient(to right,transparent,black 18%,black 82%,transparent)}
.stage-title{position:absolute;z-index:0;left:clamp(24px,3.2vw,54px);top:22px;font-family:var(--serif);font-size:clamp(24px,3.2vw,50px);letter-spacing:-.06em;color:#d4cbd1;user-select:none;pointer-events:none;opacity:.64}
.stage-label{position:absolute;z-index:0;left:clamp(24px,3.2vw,54px);top:77px;letter-spacing:.16em;font-size:10px;color:#b6acb5;pointer-events:none}
.field-watermark{position:absolute;z-index:0;bottom:19px;right:32px;letter-spacing:.19em;color:#c3b9c1;font-size:9px;pointer-events:none}
#connections{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
#bubbleLayer{position:absolute;inset:0;z-index:3;pointer-events:none}
.float-card{--card-scale:1;position:absolute;top:0;left:0;pointer-events:auto;cursor:grab;user-select:none;-webkit-user-select:none;overflow:hidden;padding:10px;border:1px solid rgba(117,93,112,.20);
 background:rgba(239,234,237,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(69,54,67,.065),0 2px 8px rgba(70,58,69,.035),inset 0 1px rgba(255,255,255,.80);
 border-radius:22px 24px 20px 24px;transform-origin:50% 50%;transition:box-shadow .25s,border-color .2s,background .25s;will-change:transform;touch-action:none;outline:none}
.float-card:hover{box-shadow:0 18px 40px rgba(72,52,68,.16),0 3px 9px rgba(69,54,67,.07);border-color:rgba(117,93,112,.45);z-index:9 !important}
.float-card.dragging{cursor:grabbing;box-shadow:0 24px 50px rgba(58,46,57,.21);z-index:30 !important}
.float-card.is-playing{border-color:#8f798a;background:rgba(240,232,236,.95);box-shadow:0 12px 34px rgba(116,87,112,.19),inset 0 1px rgba(255,255,255,.7)}
.float-card.focused{outline:1px solid rgba(132,104,126,.38);outline-offset:3px}
.float-card.enter{animation:floatEnter .55s cubic-bezier(.16,.96,.2,1) both}
@keyframes floatEnter{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:blur(0)}}
.thumb{height:81px;width:100%;border-radius:14px 15px 12px 13px;overflow:hidden;position:relative;background-size:cover;background-position:center;box-shadow:inset 0 1px 6px rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.52)}
.thumb::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,0) 55%,rgba(255,255,255,.06))}
.colorway{position:absolute;left:9px;top:10px;font-size:8px;letter-spacing:.13em;line-height:1.2;padding:5px 7px;color:#594e58;background:rgba(255,255,255,.69);backdrop-filter:blur(5px);border-radius:3px;opacity:.94}
.info{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;min-height:53px;padding:9px 2px 0 3px}
.trackcopy{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.artist{font-size:9px;letter-spacing:.09em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-transform:uppercase;color:#776b74}
.trackname{font-family:var(--serif);font-size:19px;line-height:1.1;letter-spacing:-.046em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#453742}
.actions{display:flex;align-items:center;gap:1px;flex:none}
.mini{width:25px;height:25px;border-radius:50%;background:rgba(255,255,255,.27);border:1px solid transparent;color:#675863;display:grid;place-items:center;padding:0;transition:background .18s,border-color .18s,color .18s;flex:none}
.mini:hover,.mini[aria-pressed="true"]{border-color:#bbacb9;background:#f7f0f5;color:#433642}
.mini svg{width:14px;height:14px;display:block}
.mini svg.playIcon{width:12px;height:12px;margin-left:2px}
.track-meter{position:absolute;bottom:0;left:0;height:2px;background:#a990a4;width:0%;transition:width .08s linear}
.float-card.is-saved .save-action{color:#795a6e}
.float-card.is-saved .save-action svg{fill:rgba(135,101,125,.2)}
.footer{height:86px;z-index:18;flex:none;border-top:1px solid rgba(114,96,113,.15);display:flex;gap:25px;align-items:center;justify-content:space-between;padding:14px clamp(24px,3.2vw,54px);background:rgba(245,241,243,.76);backdrop-filter:blur(18px)}
.footleft{display:flex;align-items:center;min-width:0;gap:13px;max-width:36%;white-space:nowrap}
.sound-icon{width:34px;height:34px;border:1px solid #c8bbc6;border-radius:50%;display:grid;place-items:center;flex:none;color:#695568;font-size:13px}
.sound-icon svg{width:14px;height:14px}
.now{font-size:10px;letter-spacing:.07em;overflow:hidden;text-overflow:ellipsis;line-height:1.7}
.now b{display:block;font-weight:500;color:#514251;overflow:hidden;text-overflow:ellipsis}
.now span{color:#938994}
.controls{display:flex;align-items:center;gap:13px}
.linebtn{border:1px solid #c9bec7;background:rgba(255,255,255,.38);color:#6d5e6a;border-radius:30px;padding:12px 15px;line-height:1;font-size:10px;letter-spacing:.09em;transition:background .15s,border-color .15s;white-space:nowrap}
.linebtn:hover{background:#fff;border-color:#9f8b9e}
.linebtn.accent{background:#695767;color:#fff;border-color:#695767}
.linebtn.accent:hover{background:#877283}
.motion{display:flex;align-items:center;gap:11px;white-space:nowrap;font-size:10px;color:#948693;letter-spacing:.09em}
.motion input{accent-color:#867184;width:clamp(75px,8vw,128px);height:12px;cursor:pointer}
#toast{position:absolute;z-index:80;bottom:107px;left:50%;transform:translateX(-50%) translateY(15px);opacity:0;pointer-events:none;max-width:90vw;padding:11px 18px;background:#504351;color:#fff;box-shadow:0 10px 24px #75697625;border-radius:40px;font-size:10px;letter-spacing:.08em;text-align:center;transition:opacity .23s,transform .23s}
#toast.shown{opacity:1;transform:translateX(-50%) translateY(0)}
#filePicker{display:none}
#motionPause span{display:inline-block;min-width:43px}
.legend{position:absolute;top:24px;right:clamp(24px,3.2vw,54px);font-size:9px;letter-spacing:.11em;color:#a79aa5;z-index:0;text-align:right;line-height:1.75}
@media(min-width:1700px){.float-card{padding:12px}.thumb{height:89px}}
@media(max-width:1050px){.brandcode{display:none}.topright .stateword{display:none}.footer{gap:9px}.footer .linebtn{padding:11px 11px}.motion{gap:5px}}
@media(max-width:650px){.mast{height:84px;padding:14px 16px}.logo{font-size:36px}.topright{gap:10px;font-size:9px}.total{font-size:11px;min-width:48px}.stateword{display:none!important}.stage-title{font-size:29px;top:17px;left:16px}.stage-label{left:16px;top:52px;font-size:8px}.field-watermark{display:none}.legend{right:14px;top:13px;font-size:8px}.footer{height:119px;padding:12px 15px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:35px 45px;gap:8px 12px}.footleft{max-width:none;grid-column:1 / -1}.sound-icon{width:31px;height:31px}.now{font-size:9px}.controls{grid-column:1/3;display:flex;justify-content:space-between;gap:5px}.motion{font-size:0;gap:4px}.motion input{width:52px}.motion output{font-size:9px}.controls .linebtn{padding:10px 8px;font-size:9px}.float-card .trackname{font-size:18px}.thumb{height:74px}.info{min-height:48px}.float-card{padding:8px;border-radius:19px}.artist{font-size:8px}.mini{width:23px;height:23px}.colorway{font-size:7px;top:7px;left:7px;padding:4px 6px}.stage-title,.stage-label,.legend{display:none}.controls{gap:3px}.controls .linebtn{padding:10px 7px;font-size:8px}.footer{padding-left:10px;padding-right:10px}#toast{bottom:132px}}
@media(prefers-reduced-motion:reduce){.float-card.enter{animation:none}*{scroll-behavior:auto!important}}

.embedded .brandcode{display:none}
.embedded #floatExit{display:inline-flex}
#floatExit{display:none;border:1px solid #b8aeb8;border-radius:99px;background:#ffffffb8;padding:9px 15px;font-size:11px;letter-spacing:.08em;color:#514552;cursor:pointer;white-space:nowrap}
@media(max-width:650px){#floatExit{padding:8px 11px;font-size:10px}.topright{gap:10px}.embedded .mast{padding-inline:13px}.embedded .logo{font-size:30px}.embedded .stateword{display:none}}
</style>
</head>
<body>
<div id="app">
 <header class="mast">
   <div class="brandline"><div class="logo">veilradio<span>.</span></div><div class="brandcode">LISTENING EXPERIMENT / 04</div></div>
   <div class="topright"><button id="floatExit" type="button" aria-label="Close Float Mode">← BACK</button><span class="stateword"><span class="pin"></span> FLOAT MODE / PLAYFIELD</span><span class="total" id="count">00 / 40</span></div>
 </header>
 <main class="stage" id="stage" aria-label="Floating music discovery field">
   <div class="stage-title">float.</div><div class="stage-label">A LITTLE WORLD OF RELATED SOUNDS</div>
   <div class="legend">TAP A CARD TO GROW ITS RADIO<br>DRAG TO MOVE · ▶ LISTEN · ♧ SAVE</div>
   <svg id="connections" aria-hidden="true"></svg>
   <div id="bubbleLayer"></div>
   <div class="field-watermark">NOT EVERY SONG NEEDS A DESTINATION.</div>
 </main>
 <footer class="footer">
  <div class="footleft"><div class="sound-icon" id="soundIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3 11v2m4-6v10m4-15v20m4-15v10m4-14v18m4-14v10"/></svg></div><div class="now"><b id="nowPlaying">NO SOUND PLAYING</b><span id="nowHint">Original demo loops · import your own music</span></div></div>
  <div class="controls">
   <label class="motion" for="motionRange">MOTION <input id="motionRange" type="range" min="0" max="100" value="48" aria-label="Floating speed"><output id="motionValue">48</output></label>
   <button id="motionPause" class="linebtn" type="button"><span>PAUSE</span> FLOAT</button>
   <button id="resetBtn" class="linebtn" type="button">↺ RESET</button>
   <button id="importBtn" class="linebtn accent" type="button">+ YOUR MUSIC</button>
  </div>
 </footer>
 <div id="toast" role="status" aria-live="polite"></div>
 <input id="filePicker" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac" multiple>
</div>
<script>
const floatEmbedded=window.parent!==window || new URLSearchParams(location.search).has('embedded');
let nativeCounter=0;
const nativePending=new Map();
function floatNative(action, data={}){
 if(!floatEmbedded)return Promise.reject(Error('Native bridge only available inside Veilradio'));
 const requestId='float'+(++nativeCounter);
 return new Promise((resolve,reject)=>{
  const timer=setTimeout(()=>{nativePending.delete(requestId);reject(Error('Discovery timed out. Check your connection and API key.'))},90000);
  nativePending.set(requestId,{resolve,reject,timer});
  window.parent.postMessage({type:'veil-float-request',requestId,action,...data},'*');
 });
}
const floatCache=new Map();
window.addEventListener('message',e=>{
 if(!floatEmbedded||e.source!==window.parent)return;
 const x=e.data||{};
 if(x.type==='veil-float-init'){
  if(!bubbles.length){const rows=(x.tracks||[]).slice(0,innerWidth<650?5:7);
   for(const data of rows)spawn({...data,mood:data.mood||'veil'},null,true);
   updateScale();refreshCounter();
  }
  nowHint.textContent='DEEZER VERIFIED PREVIEWS / TAP A CARD FOR NEW MUSIC';
 }
 if(x.type==='veil-float-result'){
  const entry=nativePending.get(x.requestId);if(!entry)return;
  nativePending.delete(x.requestId);clearTimeout(entry.timer);
  if(x.error)entry.reject(Error(x.error));else entry.resolve(x.data||{});
 }
});

 el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',`More songs like ${data.artist}, ${data.title}`);
 el.style.width=w+'px';el.style.height=h+'px';
 el.innerHTML=`<div class="thumb" style="background-image:url('${artwork[data.mood]||artwork.veil}')"><span class="colorway">${artNames[data.mood]||'LOCAL AUDIO'}</span></div>
 <div class="info"><div class="trackcopy"><span class="artist">${escapeHtml(data.artist)}</span><span class="trackname" title="${escapeHtml(data.title)}">${escapeHtml(data.title)}</span></div>
 <div class="actions"><button type="button" class="mini play-action" aria-label="Play ${escapeHtml(data.title)}" aria-pressed="false">${playSvg}</button><button type="button" class="mini save-action" aria-label="Bookmark ${escapeHtml(data.title)}" aria-pressed="${saved.has(data.id)}">${bookmarkSvg}</button></div></div><div class="track-meter"></div>`;
 const b={data,el,w,h,x:0,y:0,vx:rng(-.12,.12),vy:rng(-.12,.12),scale:desiredScale(bubbles.length+1),phase:rng(0,Math.PI*2),amp:rng(.7,1.3),rot:rng(-2,2),squash:0,dragging:false};
 bubbles.push(b);layer.appendChild(el);
 const {w:sw,h:sh}=dims();
 if(origin){
  // Prefer the parent’s neighbourhood, but always search for free air first.
  // The breathing room matters once a field grows toward forty records.
  let best=null, bestScore=Infinity;
  for(let k=0;k<52;k++){
    const angle=rng(0,Math.PI*2),radius=k<35?rng(105,370):rng(50,Math.max(sw,sh));
    const px=k<35?origin.x+Math.cos(angle)*radius:rng(0,sw);
    const py=k<35?origin.y+Math.sin(angle)*radius:rng(0,sh);
    const bw=b.w*b.scale*.5,bh=b.h*b.scale*.5;
    const tx=clamp(px,bw+9,sw-bw-9),ty=clamp(py,bh+9,sh-bh-9);
    let penalty=Math.hypot(tx-origin.x,ty-origin.y)*.027;
    for(const other of bubbles){if(other===b)continue;
      const ox=Math.max(0,(b.w*b.scale+other.w*other.scale)*.5+9-Math.abs(tx-other.x));
      const oy=Math.max(0,(b.h*b.scale+other.h*other.scale)*.5+9-Math.abs(ty-other.y));
      penalty+=ox*oy*.035;
    }
    if(penalty<bestScore){bestScore=penalty;best={x:tx,y:ty,angle}}
  }
  locate(b,best.x,best.y);b.vx=Math.cos(best.angle)*.7;b.vy=Math.sin(best.angle)*.7;
 }
 else{const init=[[.095,.19],[.76,.17],[.49,.47],[.13,.64],[.78,.68],[.31,.34],[.56,.80],[.34,.82],[.61,.22],[.08,.43]];
  const p=init[k%init.length]||[rng(.2,.8),rng(.2,.8)];locate(b,sw*p[0]+rng(-14,14),sh*p[1]+rng(-10,10));}
 if(!skipScale)updateScale();
 const play=el.querySelector('.play-action'),save=el.querySelector('.save-action');
 play.addEventListener('click',e=>{e.stopPropagation();toggleAudio(b)});
 save.addEventListener('click',e=>{e.stopPropagation();toggleSave(b)});
 el.addEventListener('click',e=>{if(pointerMoved){pointerMoved=false;return;}grow(b)});
 el.addEventListener('keydown',e=>{if(e.target!==el)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();grow(b)}});
 el.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;e.preventDefault();el.setPointerCapture?.(e.pointerId);const bounds=field.getBoundingClientRect();drag={b,id:e.pointerId,px:e.clientX,py:e.clientY,ox:b.x,oy:b.y,at:performance.now(),started:false};b.dragging=true;el.classList.add('dragging')});
 el.addEventListener('pointermove',e=>{if(!drag||drag.b!==b||e.pointerId!==drag.id)return;const dx=e.clientX-drag.px,dy=e.clientY-drag.py;if(Math.hypot(dx,dy)>6)drag.started=true;if(drag.started){pointerMoved=true;locate(b,drag.ox+dx,drag.oy+dy);b.vx=clamp(dx/32,-1.4,1.4);b.vy=clamp(dy/32,-1.4,1.4)}});
 const end=e=>{if(!drag||drag.b!==b||drag.id!==e.pointerId)return;b.dragging=false;el.classList.remove('dragging');const moved=drag.started;drag=null;if(moved){setTimeout(()=>pointerMoved=false,150)}else pointerMoved=false};
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
 el.addEventListener('contextmenu',e=>{e.preventDefault();removeBubble(b);toast('REMOVED FROM THE FIELD')});
 refreshCounter();return b;
}
function removeBubble(b){const i=bubbles.indexOf(b);if(i<0)return;if(playingId===b.data.id)stopAudio();bubbles.splice(i,1);used.delete(b.data.id);b.el.remove();updateScale();refreshCounter()}
function refreshCounter(){counter.textContent=String(bubbles.length).padStart(2,'0')+' / 40';counter.title=bubbles.length+' out of 40 floating cards'}
function pulseLink(a,b){const path=document.createElementNS('http://www.w3.org/2000/svg','path');const mx=(a.x+b.x)*.5, my=(a.y+b.y)*.5-38;path.setAttribute('d',`M${a.x},${a.y} Q${mx},${my} ${b.x},${b.y}`);path.setAttribute('fill','none');path.setAttribute('stroke','#b99ead');path.setAttribute('stroke-width','1.2');path.setAttribute('stroke-dasharray','4 8');path.style.opacity='.85';path.style.transition='opacity 1.6s';svg.appendChild(path);requestAnimationFrame(()=>path.style.opacity='0');setTimeout(()=>path.remove(),1750)}
async function grow(b){
 if(floatEmbedded){
  if(bubbles.length>=40){toast('40 / 40 · FLOAT FIELD IS FULL');return}
  const key=b.data.id;
  if(!floatCache.has(key)||!floatCache.get(key).length){
   if(b.loading)return;b.loading=true;b.el.classList.add('focused');toast('SEARCHING FOR RELATED MUSIC…');
   try{const out=await floatNative('related',{seed:b.data,exclude:bubbles.map(x=>x.data)});
    floatCache.set(key,(out.tracks||[]).filter(x=>!used.has(x.id)));
   }catch(e){toast(String(e.message||e).slice(0,110));b.loading=false;return}
   b.loading=false;
  }
  const cache=floatCache.get(key)||[];
  let made=0;
  while(made<3&&cache.length&&bubbles.length<40){const t=cache.shift();if(used.has(t.id))continue;const child=spawn(t,b,true);if(child){pulseLink(b,child);made++}}
  updateScale();b.el.classList.add('focused');setTimeout(()=>b.el.classList.remove('focused'),950);
  toast(made?'+ '+made+' SIMILAR RECORDINGS':'NO NEW RECORDINGS FOUND · TRY ANOTHER');
  return;
 }
 if(bubbles.length>=40){toast('40 / 40 · THE FLOAT FIELD IS FULL');return}
 const count=Math.min(bubbles.length>29?2:3,40-bubbles.length);
 let made=0;
 for(let i=0;i<count;i++){const t=chooseNew(b);if(!t)break;const c=spawn(t,b,true);if(c){pulseLink(b,c);made++}}
 updateScale();b.el.classList.add('focused');setTimeout(()=>b.el.classList.remove('focused'),950);
 toast(made?`+ ${made} SIMILAR SOUNDS RELEASED`:'NO NEW SOUNDS LEFT');
}
function toggleSave(b){if(saved.has(b.data.id))saved.delete(b.data.id);else saved.add(b.data.id);
 try{localStorage.setItem('veilradio.float.bookmarks.v1',JSON.stringify([...saved]))}catch(e){}
 b.el.classList.toggle('is-saved',saved.has(b.data.id));b.el.querySelector('.save-action').setAttribute('aria-pressed',String(saved.has(b.data.id)));
 if(floatEmbedded&&b.data.source!=='local')void floatNative('bookmark',{track:b.data,saved:saved.has(b.data.id)}).catch(e=>toast(e.message));
 toast(saved.has(b.data.id)?'BOOKMARKED TO YOUR SAVED ARCHIVE':'BOOKMARK REMOVED');
}
function paintPlaying(){bubbles.forEach(b=>{const on=b.data.id===playingId&&!audio.paused;b.el.classList.toggle('is-playing',on);const btn=b.el.querySelector('.play-action');btn.innerHTML=on?pauseSvg:playSvg;btn.setAttribute('aria-pressed',String(on));btn.setAttribute('aria-label',(on?'Pause ':'Play ')+b.data.title)});}
async function toggleAudio(b){if(playingId===b.data.id&&!audio.paused){audio.pause();paintPlaying();toast('PAUSED');return}
 try{audio.pause();playingId=b.data.id;
  let playable=b.data.url||(demos[b.data.demo]||demos[0]);
  if(floatEmbedded&&b.data.source!=='local'){
   const result=await floatNative('preview',{track:b.data});playable=result.url||'';
   if(!playable)throw Error('No verified Deezer preview');
  }
  audio.src=playable;audio.currentTime=0;audio.playbackRate=b.data.rate||1;
  playingText.textContent=(b.data.artist+' / '+b.data.title).toUpperCase();nowHint.textContent=b.data.source==='local'?'YOUR LOCAL FILE':floatEmbedded?'DEEZER / 30 SEC VERIFIED PREVIEW':'ORIGINAL DEMO AUDIO / FLOAT STUDY';
  await audio.play();paintPlaying();toast('NOW PLAYING · '+b.data.title.toUpperCase());
 }catch(e){paintPlaying();toast(floatEmbedded?'PREVIEW UNAVAILABLE · TRY ANOTHER RECORD':'AUDIO NOT AVAILABLE · TRY ANOTHER CARD')}
}
function stopAudio(){audio.pause();audio.removeAttribute('src');audio.load();playingId=null;playingText.textContent='NO SOUND PLAYING';nowHint.textContent='Original demo loops · import your own music';paintPlaying()}
audio.addEventListener('ended',()=>{stopAudio()});audio.addEventListener('pause',paintPlaying);audio.addEventListener('play',paintPlaying);
const prefersReducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function animate(now){if(!last)last=now;const dt=Math.min(2,(now-last)/16.67),speed=(+motionRange.value/100)*1.3;last=now;tick+=dt;
 const {w,h}=dims();
 if(!frozen&&!prefersReducedMotion){
  for(let i=0;i<bubbles.length;i++){
   const a=bubbles[i];if(a.dragging)continue;
   a.vx+=Math.sin(tick*.004+a.phase)*speed*.007*dt*a.amp;
   a.vy+=Math.cos(tick*.0047+a.phase*.8)*speed*.006*dt*a.amp;
   a.vx*=.990;a.vy*=.990;
   a.vx=clamp(a.vx,-.6-speed*1.25,.6+speed*1.25);a.vy=clamp(a.vy,-.6-speed*1.25,.6+speed*1.25);
   a.x+=a.vx*dt;a.y+=a.vy*dt;
   const halfW=a.w*a.scale*.5,halfH=a.h*a.scale*.5;
   if(a.x<halfW+10){a.x=halfW+10;a.vx=Math.abs(a.vx)*.66;a.squash=.085}
   if(a.x>w-halfW-10){a.x=w-halfW-10;a.vx=-Math.abs(a.vx)*.66;a.squash=.085}
   if(a.y<halfH+10){a.y=halfH+10;a.vy=Math.abs(a.vy)*.66;a.squash=.085}
   if(a.y>h-halfH-10){a.y=h-halfH-10;a.vy=-Math.abs(a.vy)*.66;a.squash=.085}
   a.squash*=.92;
  }
  // Soft, jelly-like edge repulsion. Cards never rigidly snap to grid positions.
  for(let i=0;i<bubbles.length;i++)for(let j=i+1;j<bubbles.length;j++){
    const a=bubbles[i],b=bubbles[j],dx=b.x-a.x,dy=b.y-a.y;
    const ox=(a.w*a.scale+b.w*b.scale)*.5+11-Math.abs(dx),oy=(a.h*a.scale+b.h*b.scale)*.5+11-Math.abs(dy);
    if(ox<=0||oy<=0)continue;
    const strength=.036*dt*(.65+speed*.6);
    if(ox<oy){const v=(dx<0?-1:1)*(Math.min(ox,90))*strength;if(!a.dragging){a.vx-=v;a.x-=Math.min(ox,8)*.14}if(!b.dragging){b.vx+=v;b.x+=Math.min(ox,8)*.14}}
    else{const v=(dy<0?-1:1)*(Math.min(oy,60))*strength;if(!a.dragging){a.vy-=v;a.y-=Math.min(oy,8)*.14}if(!b.dragging){b.vy+=v;b.y+=Math.min(oy,8)*.14}}
    a.squash=clamp(a.squash+.045,0,.14);b.squash=clamp(b.squash+.045,0,.14);
  }
 }
 for(const b of bubbles){
   const move=(!frozen&&!prefersReducedMotion)?Math.sin(tick*.008+b.phase)*.022:0;
   const sx=b.scale*(1+b.squash+move),sy=b.scale*(1-b.squash*.65-move*.7);
   b.el.style.transform=`translate3d(${(b.x-b.w*.5).toFixed(2)}px,${(b.y-b.h*.5).toFixed(2)}px,0) scale(${sx.toFixed(4)},${sy.toFixed(4)}) rotate(${(b.rot+Math.sin(tick*.005+b.phase)*.9).toFixed(2)}deg)`;
 }
 if(playingId&&now-lastProgress>160){lastProgress=now;const b=bubbles.find(x=>x.data.id===playingId);if(b){b.el.querySelector('.track-meter').style.width=(audio.duration?clamp(audio.currentTime/audio.duration,0,1)*100:0)+'%'}}
 requestAnimationFrame(animate);
}
function seed(){if(floatEmbedded)return;const n=innerWidth<650?5:7;const indices=[0,1,2,3,4,5,6,7];indices.slice(0,n).forEach(i=>spawn(catalog[i],null,true));updateScale();refreshCounter()}
seed();requestAnimationFrame(animate);
motionRange.addEventListener('input',()=>{motionValue.textContent=motionRange.value;frozen=false;document.querySelector('#motionPause span').textContent='PAUSE'});
document.querySelector('#motionPause').addEventListener('click',()=>{frozen=!frozen;document.querySelector('#motionPause span').textContent=frozen?'RESUME':'PAUSE';toast(frozen?'FLOATS HELD STILL':'FLOATS RELEASED')});
document.querySelector('#floatExit').addEventListener('click',()=>{if(floatEmbedded){stopAudio();window.parent.postMessage({type:'veil-float-close'},'*')}});
document.querySelector('#resetBtn').addEventListener('click',()=>{stopAudio();bubbles.forEach(b=>{if(b.data.url?.startsWith('blob:'))URL.revokeObjectURL(b.data.url);b.el.remove()});bubbles=[];used.clear();tick=0;seed();if(floatEmbedded)window.parent.postMessage({type:'veil-float-ready'},'*');toast('A FRESH FLOAT FIELD')});
document.querySelector('#importBtn').addEventListener('click',()=>filePicker.click());
filePicker.addEventListener('change',()=>{
 let added=0;for(const file of [...filePicker.files]){if(bubbles.length>=40)break;
  const raw=file.name.replace(/\.[^.]+$/,'');const parts=raw.split(/\s+[-–]\s+/);
  const track={id:'local'+nextImport++,artist:parts.length>1?parts.shift():'YOUR DEVICE',title:parts.join(' - ')||raw,mood:['veil','rose','ice'][added%3],source:'local',url:URL.createObjectURL(file)};
  spawn(track,null,true);added++;
 }updateScale();filePicker.value='';toast(added?`${added} LOCAL SONG${added===1?'':'S'} ADDED · CLICK ▶ TO PLAY`:'FLOAT FIELD FULL · MAXIMUM 40')
});
