name: Build Veilradio Windows Desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'tools/**'
      - 'app/src/main/assets/float.html'
      - '.github/workflows/windows-desktop.yml'
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Windows app from latest Veilradio
        run: |
          python -m pip install pillow
          python tools/patch_android_settings_bridge.py
          python tools/fix_android_tab_navigation.py
          python tools/fix_native_bridge_0517.py
          python tools/prepare_windows_desktop.py
      - name: Enable endless discovery with niche depth slider
        run: python tools/patch_desktop_discovery_0519.py
      - name: Integrate Float Mode into Windows
        run: |
          python -c "import shutil; shutil.copyfile('app/src/main/assets/float.html', 'desktop/assets/float.html')"
          python tools/patch_float_mode_0520.py desktop/assets/veilradio.html
      - name: Make Signal scrollable with a compact depth slider
        run: python tools/patch_radio_signal_0521.py desktop/assets/veilradio.html
      - name: Keep the Signal overlay scrollable on phones
        run: python tools/patch_mobile_signal_scroll_0521.py desktop/assets/veilradio.html
      - name: Prefetch similar Float songs while playing
        run: python tools/patch_float_prefetch_0521.py desktop/assets/float.html
      - name: Check desktop API syntax
        working-directory: desktop
        run: node --check api.js
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build Windows portable EXE
        working-directory: desktop
        run: npm run dist:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Veilradio-Windows-Desktop-05.21
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30