name: Build Veilradio Windows Desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'tools/**'
      - 'app/src/main/assets/float.html'
      - '.github/workflows/windows-desktop.yml'
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Windows interface and bundled Float assets
        run: |
          python -m pip install pillow
          python tools/prepare_windows_desktop.py
          python -c "import shutil; shutil.copyfile('app/src/main/assets/float.html', 'desktop/assets/float.html')"
      - name: Check desktop API syntax
        working-directory: desktop
        run: node --check api.js
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build Windows portable EXE
        working-directory: desktop
        run: npm run dist:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Veilradio-Windows-Desktop-05.22
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30